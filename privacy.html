<h1>プライバシーポリシー</h1>
<p>本アプリ「horie」は、運営者本人の YouTube チャンネルに動画をアップロードするためだけに、Google の YouTube Data API（youtube.upload 権限）を使用します。</p>
<p>取得した認証情報は運営者の PC 内にのみ保存し、第三者への提供や他の目的での利用は行いません。</p>
<p>本アプリは運営者本人のみが利用し、他のユーザーの情報は取得しません。</p>
